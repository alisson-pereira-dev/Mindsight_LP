server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome (Vite) podem ficar em cache por 1 ano
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Favicons e demais arquivos de public/: cache curto
  location ~* \.(?:png|jpg|jpeg|webp|svg|ico|mp4|webm|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # O HTML nunca fica em cache, para publicar atualizações na hora
  # (add_header em um location substitui os do nível servidor, por isso repetimos aqui)
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
